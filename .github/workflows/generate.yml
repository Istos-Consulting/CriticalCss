name: CriticalCss reusable generator

on:
  workflow_call:
    inputs:
      connector_url:
        required: true
        type: string
      css_path:
        required: true
        type: string
      queue_updated_at:
        required: false
        type: string
    secrets:
      api_token:
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: critical-css-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out client repository
        uses: actions/checkout@v4
        with:
          path: client
          fetch-depth: 0

      - name: Check out versioned CriticalCss implementation
        uses: actions/checkout@v4
        with:
          repository: Istos-Consulting/CriticalCss
          ref: v0.1.13
          path: criticalcss

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: criticalcss/package-lock.json

      - name: Install generation dependencies
        working-directory: criticalcss
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm ci

      - name: Download MODX queue
        env:
          CONNECTOR_URL: ${{ inputs.connector_url }}
          API_TOKEN: ${{ secrets.api_token }}
        run: |
          mkdir -p runtime
          curl --fail-with-body --silent --show-error \
            -H "X-CriticalCss-Token: ${API_TOKEN}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            "${CONNECTOR_URL}?action=queue" \
            --output runtime/queue.json
          jq empty runtime/queue.json

      - name: Check queue
        id: queue
        run: |
          count=$(jq '.resources | length' runtime/queue.json)
          full=$(jq -r '.full_rebuild' runtime/queue.json)
          css_rebuild=$(jq -r '.css_rebuild // false' runtime/queue.json)
          if [ "$count" = "0" ] && [ "$full" != "true" ] && [ "$css_rebuild" != "true" ]; then
            empty=true
          else
            empty=false
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "empty=$empty" >> "$GITHUB_OUTPUT"

      - name: Resolve and download source CSS
        if: steps.queue.outputs.empty != 'true'
        env:
          CONNECTOR_URL: ${{ inputs.connector_url }}
          API_TOKEN: ${{ secrets.api_token }}
        run: |
          curl --fail-with-body --location --silent --show-error \
            -H "X-CriticalCss-Token: ${API_TOKEN}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            "${CONNECTOR_URL}?action=stylesheet" \
            --dump-header runtime/styles.headers \
            --output runtime/styles.min.css
          cp runtime/styles.min.css runtime/styles.penthouse.css
          filename=$(awk -F': ' 'tolower($1) == "x-criticalcss-stylesheet" {gsub("\r", "", $2); print $2}' runtime/styles.headers)
          current_hash=$(sha256sum runtime/styles.penthouse.css | cut -d " " -f 1)
          previous_hash=$(jq -r '.__criticalcss.stylesheetHash // "not recorded"' client/assets/css/critical/critical-manifest.json 2>/dev/null || echo "not recorded")
          echo "Downloaded CSS: ${filename:-unknown}"
          echo "Downloaded CSS SHA-256: ${current_hash}"
          echo "Manifest CSS SHA-256: ${previous_hash}"

      - name: Select queued or globally affected resources
        id: selection
        if: steps.queue.outputs.empty != 'true'
        env:
          CONNECTOR_URL: ${{ inputs.connector_url }}
          API_TOKEN: ${{ secrets.api_token }}
        run: |
          current_hash=$(sha256sum runtime/styles.penthouse.css | cut -d " " -f 1)
          previous_hash=$(jq -r '.__criticalcss.stylesheetHash // ""' \
            client/assets/css/critical/critical-manifest.json 2>/dev/null || true)
          full=$(jq -r '.full_rebuild' runtime/queue.json)

          if [ "$full" = "true" ] || [ "$current_hash" != "$previous_hash" ]; then
            curl --fail-with-body --silent --show-error \
              -H "X-CriticalCss-Token: ${API_TOKEN}" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              "${CONNECTOR_URL}?action=eligible" \
              --output runtime/eligible.json
            jq --slurpfile eligible runtime/eligible.json \
              '.resources = $eligible[0].resources' \
              runtime/queue.json \
              > runtime/work.json
          else
            cp runtime/queue.json runtime/work.json
          fi
          echo "count=$(jq '.resources | length' runtime/work.json)" >> "$GITHUB_OUTPUT"

      - name: Generate Critical CSS
        id: generation
        if: steps.queue.outputs.empty != 'true'
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p client/assets/css/critical
          set +e
          node criticalcss/scripts/generate-critical-css.js \
            runtime/work.json \
            runtime/styles.penthouse.css \
            client/assets/css/critical/
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Build ingestion payload
        if: steps.queue.outputs.empty != 'true'
        run: |
          node criticalcss/scripts/build-upload-payload.js \
            client/assets/css/critical/ \
            runtime/queue.json \
            client/assets/css/critical/changed-files.txt \
            client/assets/css/critical/acknowledged-resources.txt \
            client/assets/css/critical/generation-status.json \
            > runtime/updates.json
          jq empty runtime/updates.json
          node criticalcss/scripts/write-upload-batches.js \
            runtime/updates.json \
            runtime/upload-batches \
            524288

      - name: Ingest generated CSS
        if: steps.queue.outputs.empty != 'true'
        env:
          CONNECTOR_URL: ${{ inputs.connector_url }}
          API_TOKEN: ${{ secrets.api_token }}
        run: |
          for payload in runtime/upload-batches/*.json; do
            echo "Uploading $(basename "$payload")"
            curl --fail-with-body --silent --show-error \
              -X POST \
              "${CONNECTOR_URL}?action=ingest" \
              -H "X-CriticalCss-Token: ${API_TOKEN}" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              --form "payload=@${payload};type=application/json"
          done

      - name: Persist comparison manifest
        if: steps.queue.outputs.empty != 'true'
        working-directory: client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/critical/critical-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Critical CSS manifest"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Report incomplete generation
        if: steps.queue.outputs.empty != 'true' && steps.generation.outputs.exit_code != '0'
        run: |
          jq . client/assets/css/critical/generation-status.json
          echo "::error::Critical CSS generation was incomplete. Successful resources were ingested; failed resources remain queued for retry."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## CriticalCss"
            echo "- Queued resources: ${{ steps.queue.outputs.count }}"
            echo "- Selected resources: ${{ steps.selection.outputs.count }}"
            echo "- Full rebuild: ${{ steps.queue.outputs.full }}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
